[project]
name = "api-tester-tui"
version = "0.1.0"
description = "Terminal API tester with Textual"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.52",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"